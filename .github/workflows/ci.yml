name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install
      - name: Publish generated lockfile snapshot
        if: github.event_name == 'pull_request'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          cp bun.lock /tmp/opinny-bun.lock
          git fetch origin "$HEAD_SHA"
          git checkout --detach FETCH_HEAD
          cp /tmp/opinny-bun.lock bun.lock
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "chore: capture generated bun lockfile"
          git push --force origin HEAD:refs/heads/audit/generated-bun-lock
      - name: Run quality gate
        run: bun run check
