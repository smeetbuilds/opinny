version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Next.js 16's build toolchain currently requires the stable TypeScript
      # and ESLint major lines pinned in package.json. Review major upgrades
      # manually after validating a clean production build.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
      - dependency-name: eslint
        update-types:
          - version-update:semver-major
    groups:
      next-react:
        patterns:
          - next
          - react
          - react-dom
          - eslint-config-next
      developer-tooling:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
