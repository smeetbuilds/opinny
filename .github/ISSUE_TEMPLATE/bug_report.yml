name: Bug report
description: Report a reproducible Opinny frontend problem
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Opinny is an open-source project developed by Aahav Labs. Please do not include private keys, recovery phrases, secrets or personal data.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide exact steps, route and viewport/device.
    validations:
      required: true
  - type: dropdown
    id: viewport
    attributes:
      label: Viewport
      options:
        - Desktop
        - Laptop
        - Tablet
        - Mobile
        - Multiple
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, OS, commit SHA and deployment context.
  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: I removed secrets, private keys and recovery phrases.
          required: true
        - label: I checked existing issues for duplicates.
          required: true
