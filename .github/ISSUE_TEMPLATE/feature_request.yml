name: Feature request
description: Propose a frontend, integration-contract or admin improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Opinny is open source and developed by Aahav Labs. Proposed features must preserve the frontend-only, backend-agnostic and crypto-only product boundaries.
  - type: textarea
    id: need
    attributes:
      label: User need
      description: What user or operator problem should be solved?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed experience
      description: Describe screens, states and responsive behaviour.
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Requirement checks
      options:
        - label: This remains frontend only.
          required: true
        - label: This does not add a fiat payment gateway.
          required: true
        - label: This can use backend-neutral contracts.
          required: true
        - label: This does not copy another platform's branding or assets.
          required: true
